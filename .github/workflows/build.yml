name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (archive without signing)
        run: |
          xcodebuild archive \
            -project ClassWorkbench.xcodeproj \
            -scheme ClassWorkbench \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ClassWorkbench.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Create unsigned IPA
        run: |
          # Manually copy resources into .app bundle
          APP_PATH="ClassWorkbench.xcarchive/Products/Applications/ClassWorkbench.app"
          cp ClassWorkbench/index.html "$APP_PATH/"
          cp -R ClassWorkbench/Assets.xcassets "$APP_PATH/"
          cp ClassWorkbench/LaunchScreen.storyboardc "$APP_PATH/" 2>/dev/null || true
          # If storyboardc doesn't exist (compiled), copy raw storyboard
          if [ ! -f "$APP_PATH/LaunchScreen.storyboardc" ]; then
            cp ClassWorkbench/LaunchScreen.storyboard "$APP_PATH/"
          fi
          echo "App contents:"
          ls -la "$APP_PATH/"
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ClassWorkbench.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassWorkbench-unsigned
          path: ClassWorkbench.ipa
          retention-days: 90

      - name: Show IPA info
        run: |
          echo "========================================="
          echo "  IPA 构建完成！"
          echo "  文件: ClassWorkbench.ipa"
          echo "  大小: $(du -sh ClassWorkbench.ipa | cut -f1)"
          echo "========================================="
          echo ""
          echo "📱 安装到 iPhone 的方法："
          echo "  1. 下载本页面的 Artifact: ClassWorkbench-unsigned"
          echo "  2. 解压得到 ClassWorkbench.ipa"
          echo "  3. 使用爱思助手 / AltStore / Sideloadly 侧载安装"
          echo ""
          echo "⚠️ 免费 Apple ID 签名有效期仅 7 天，到期需重签"
